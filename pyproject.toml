[project]
name = "fnewsai"
version = "0.1.0"
description = "Claim-level news verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8",
    "beautifulsoup4>=4.15.0",
    "python-dotenv>=1.0",
    "groq>=1.7.0",
    "pydantic>=2",
    "requests>=2.34.2",
    "tavily-python>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fnewsai = "fnewsai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fnewsai"]
